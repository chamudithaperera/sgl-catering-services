name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        working-directory: client
        run: |
          npm ci
          VITE_API_URL=https://api.sglcateringservice.lk/api npm run build

      - name: Create deployment archives
        run: |
          tar -C client/dist -czf frontend.tar.gz .
          tar -C server \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='uploads' \
            --exclude='tmp' \
            -czf server.tar.gz .

      - name: Configure SSH
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${CPANEL_HOST:?Missing CPANEL_HOST secret}"
          : "${CPANEL_USER:?Missing CPANEL_USER secret}"
          : "${CPANEL_SSH_KEY:?Missing CPANEL_SSH_KEY secret}"

          SSH_PORT="${CPANEL_PORT:-22}"
          CPANEL_HOST="${CPANEL_HOST#http://}"
          CPANEL_HOST="${CPANEL_HOST#https://}"
          CPANEL_HOST="${CPANEL_HOST%%/*}"
          CPANEL_HOST="${CPANEL_HOST#*@}"

          if [[ "$CPANEL_HOST" == *:* ]]; then
            CPANEL_HOST="${CPANEL_HOST%%:*}"
          fi

          if ! [[ "$SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::CPANEL_PORT must be a number."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$CPANEL_SSH_KEY" | perl -0pe 's/\\n/\n/g; s/\r//g' > ~/.ssh/cpanel_deploy_key
          printf '\n' >> ~/.ssh/cpanel_deploy_key
          chmod 600 ~/.ssh/cpanel_deploy_key
          if ! ssh-keygen -y -f ~/.ssh/cpanel_deploy_key > /dev/null; then
            echo "::error::CPANEL_SSH_KEY must be a valid unencrypted private key."
            exit 1
          fi

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host cpanel
            HostName $CPANEL_HOST
            User $CPANEL_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/cpanel_deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 30
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          echo "SSH deployment target configured for $CPANEL_USER@$CPANEL_HOST on port $SSH_PORT."

      - name: Test SSH connection
        run: |
          ssh cpanel "printf 'SSH connection ready\n'"

      - name: Upload deployment archives
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          scp -o ConnectTimeout=30 frontend.tar.gz server.tar.gz "cpanel:/home/$CPANEL_USER/"

      - name: Deploy on cPanel
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          ssh cpanel "CPANEL_USER='$CPANEL_USER' bash -s" <<'EOF'
          set -e

          APP_ROOT="/home/$CPANEL_USER/sgl-project-git/server"
          PUBLIC_HTML="/home/$CPANEL_USER/public_html"
          NODE_ACTIVATE="/home/$CPANEL_USER/nodevenv/sgl-project-git/server/20/bin/activate"

          mkdir -p "$APP_ROOT" "$PUBLIC_HTML" "$APP_ROOT/uploads" "$APP_ROOT/tmp"

          tar -xzf "/home/$CPANEL_USER/server.tar.gz" -C "$APP_ROOT"
          tar -xzf "/home/$CPANEL_USER/frontend.tar.gz" -C "$PUBLIC_HTML"

          cat > "$PUBLIC_HTML/.htaccess" <<'HTACCESS'
          Options -MultiViews
          AddType video/mp4 .mp4
          AddType video/webm .webm
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/jpeg "access plus 7 days"
            ExpiresByType image/png "access plus 7 days"
            ExpiresByType image/webp "access plus 7 days"
            ExpiresByType video/mp4 "access plus 7 days"
            ExpiresByType video/webm "access plus 7 days"
          </IfModule>
          <IfModule mod_headers.c>
            <FilesMatch "\.(jpg|jpeg|png|webp|mp4|webm)$">
              Header set Cache-Control "public, max-age=604800"
            </FilesMatch>
          </IfModule>
          RewriteEngine On

          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]
          HTACCESS

          source "$NODE_ACTIVATE"
          cd "$APP_ROOT"
          npm install --include=dev
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm run prisma:seed
          touch tmp/restart.txt

          rm -f "/home/$CPANEL_USER/frontend.tar.gz" "/home/$CPANEL_USER/server.tar.gz"
          EOF
